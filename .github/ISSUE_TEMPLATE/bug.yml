name: Bug report
description: Something does not work as the manual says
labels: [bug]
body:
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.5, Apple silicon, one display"
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: ["Parked (default)", "Real desktops (useSpaces: true)"]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
      description: Steps, the apps involved, and what the menu bar showed.
    validations: { required: true }
  - type: textarea
    id: config
    attributes:
      label: Output of `~/Applications/calmtile.app/Contents/MacOS/calmtile --print-config`
      description: Run it directly in a shell, not through `open`. Remove anything you do not want to share.
      render: json
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: >
        The relevant lines of `~/Library/Logs/calmtile.log`. calmtile does not log window titles, but look at the
        lines before you paste them and remove anything you do not want to publish.
      render: text
